name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NEXT_PUBLIC_SITE_URL: https://tinkerhub-sngce.com

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build project
        run: npm run build

      - name: Verify SEO configuration
        run: |
          echo "Checking for sitemap.ts..."
          test -f app/sitemap.ts && echo "✓ sitemap.ts found" || exit 1
          echo "Checking for robots.ts..."
          test -f app/robots.ts && echo "✓ robots.ts found" || exit 1
          echo "Checking for SEO documentation..."
          test -f SEO_GUIDE.md && echo "✓ SEO_GUIDE.md found" || exit 1
          echo "Checking for schema utilities..."
          test -f data/schema.ts && echo "✓ schema.ts found" || exit 1
          test -f data/seo-utils.ts && echo "✓ seo-utils.ts found" || exit 1
          echo "All SEO files verified!"

      - name: Validate sitemap structure
        run: |
          echo "Verifying sitemap includes required routes..."
          grep -q "sitemap.ts" app/sitemap.ts && echo "✓ Sitemap configured" || exit 1

      - name: Validate robots.txt configuration
        run: |
          echo "Verifying robots.txt includes AI agents..."
          grep -q "robots.ts" app/robots.ts && echo "✓ Robots file configured" || exit 1


